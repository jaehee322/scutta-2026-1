{% extends "base.html" %}

{% block title %}{{ _('경기 결과 제출') }} - SCUTTA{% endblock %}

{% block container_style %}margin-top: 0;{% endblock %}

{% block header_left %}
<a href="{{ url_for('main.index') }}" class="text-xl font-bold truncate">
    {{ _('경기 결과 제출') }}
</a>
{% endblock %}

{% block content %}
<div class="card max-w-md mx-auto" style="padding: 1.5rem;">
    <h2 class="text-xl font-bold mb-6 text-center">{{ _('경기 결과 입력') }}</h2>

    <form id="match-form" class="space-y-5">
        <div>
            <label class="block text-sm font-semibold text-gray-500 mb-1.5">{{ _('승리자') }}</label>
            <div class="relative">
                <input type="text" id="winner-name" class="w-full" placeholder="{{ _('이름을 입력하세요') }}"
                    autocomplete="off">
                <div id="winner-suggestions"
                    class="absolute z-10 w-full bg-white border border-gray-100 rounded-xl shadow-lg mt-1 hidden max-h-48 overflow-y-auto">
                </div>
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-500 mb-1.5">{{ _('패배자') }}</label>
            <div class="relative">
                <input type="text" id="loser-name" class="w-full" placeholder="{{ _('이름을 입력하세요') }}" autocomplete="off">
                <div id="loser-suggestions"
                    class="absolute z-10 w-full bg-white border border-gray-100 rounded-xl shadow-lg mt-1 hidden max-h-48 overflow-y-auto">
                </div>
            </div>
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-500 mb-2">{{ _('스코어') }}</label>
            <div class="score-radio-group">
                <label class="score-radio-label">
                    <input type="radio" name="score" value="3:0" checked>
                    <span>3 : 0</span>
                </label>
                <label class="score-radio-label">
                    <input type="radio" name="score" value="2:1">
                    <span>2 : 1</span>
                </label>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            {{ _('결과 제출하기') }}
        </button>
    </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/submit_match.js') }}"></script>
{% endblock %}
