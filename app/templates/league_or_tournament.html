{% extends "base.html" %}

{% block title %}{{ _('리그전 및 토너먼트') }} - SCUTTA{% endblock %}

{% block container_style %}margin-top: 0;{% endblock %}

{% block header_left %}
<a href="{{ url_for('main.index') }}" class="text-xl font-bold truncate">
    {{ _('리그전 및 토너먼트') }}
</a>
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6 mt-10">
    <a href="{{ url_for('league.league') }}"
        class="block p-8 bg-white rounded-xl hover:shadow-lg transition transform hover:-translate-y-1 text-center border border-gray-100 hover:border-blue-300">
        <div class="text-4xl mb-4">🏆</div>
        <h2 class="text-2xl font-bold text-gray-800">{{ _('리그전') }}</h2>
    </a>

    <a href="{{ url_for('league.tournament') }}"
        class="block p-8 bg-white rounded-xl hover:shadow-lg transition transform hover:-translate-y-1 text-center border border-gray-100 hover:border-blue-300">
        <div class="text-4xl mb-4">⚔️</div>
        <h2 class="text-2xl font-bold text-gray-800">{{ _('토너먼트') }}</h2>
    </a>
</div>
{% endblock %}
