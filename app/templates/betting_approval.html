{% extends "base.html" %}

{% block title %}베팅 결과 승인 - SCUTTA{% endblock %}

{% block container_style %}margin-top: 0;{% endblock %}

{% block header_left %}
<a href="{{ url_for('main.index') }}" class="text-lg font-bold truncate">
    베팅 결과 승인
</a>
{% endblock %}

{% block content %}
<div class="card">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">베팅 결과 승인</h2>
        <div class="space-x-2">
            <button onclick="approveAllBettings()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">전체 승인</button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-gray-200 mb-6 sticky top-0 bg-white z-10 w-full overflow-x-auto whitespace-nowrap hide-scrollbar">
        <button class="tab px-4 py-2 font-medium text-gray-500 hover:text-gray-700 focus:outline-none border-b-2 border-transparent hover:border-gray-300 transition shrink-0 active" onclick="selectTab(this, 'all')">전체</button>
        <button class="tab px-4 py-2 font-medium text-gray-500 hover:text-gray-700 focus:outline-none border-b-2 border-transparent hover:border-gray-300 transition shrink-0" onclick="selectTab(this, 'pending')">대기 중</button>
        <button class="tab px-4 py-2 font-medium text-gray-500 hover:text-gray-700 focus:outline-none border-b-2 border-transparent hover:border-gray-300 transition shrink-0" onclick="selectTab(this, 'approved')">승인 완료</button>
    </div>

    <div class="overflow-x-auto">
        <table class="table-modern w-full whitespace-nowrap">
            <thead>
                <tr>
                    <th class="w-10 text-center">
                        <input type="checkbox" onchange="toggleSelectAll(this)" class="h-4 w-4 rounded border-gray-300">
                    </th>
                    <th class="text-center">승인</th>
                    <th class="text-center">승자</th>
                    <th class="text-center">스코어</th>
                    <th class="text-center">패자</th>
                    <th class="text-center">승자 베팅</th>
                    <th class="text-center">패자 베팅</th>
                    <th class="text-center">포인트</th>
                </tr>
            </thead>
            <tbody id="betting-table-body">
                <!-- Data will be loaded here via JS -->
            </tbody>
        </table>
    </div>

    <div class="mt-4 flex gap-2">
        <button onclick="approveBettings()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded transition">선택 승인</button>
        <button onclick="deleteBettings()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded transition">선택 삭제</button>
    </div>

    <div class="text-center mt-6">
        <button id="load-more" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-6 rounded btn-transition w-full max-w-xs focus:outline-none focus:ring-2 focus:ring-gray-400">
            더 보기
        </button>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/betting_approval.js') }}"></script>
{% endblock %}
