{% extends "base.html" %}

{% block title %}선수 배정 - SCUTTA{% endblock %}

{% block container_style %}margin-top: 0;{% endblock %}

{% block header_left %}
<a href="{{ url_for('main.index') }}" class="text-lg font-bold truncate">
    선수 배정
</a>
{% endblock %}

{% block content %}
<div class="card">
    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <h2 class="text-2xl font-bold w-full md:w-auto text-center md:text-left" id="player-count-title">선수 관리</h2>
        <div class="flex w-full md:w-auto gap-2">
            <input type="text" id="player-search-input" placeholder="이름"
                class="flex-grow md:w-40 px-3 py-2 border rounded-lg text-sm">
            <button id="player-search-btn"
                class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded-lg text-sm font-bold whitespace-nowrap">검색</button>
        </div>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full text-center text-sm md:text-base">
            <thead class="bg-gray-100 text-gray-700">
                <tr>
                    <th class="p-2 whitespace-nowrap">이름</th>
                    <th class="p-2 w-16 md:w-24 whitespace-nowrap">업적</th>
                    <th class="p-2 w-16 md:w-24 whitespace-nowrap">베팅</th>
                    <th class="p-2 w-16 md:w-24 whitespace-nowrap">스쿠타</th>
                    <th class="p-2 w-14 md:w-20 whitespace-nowrap">부수</th>
                </tr>
            </thead>
            <tbody id="assignment-player-list-body" class="divide-y divide-gray-100">
                <!-- JS로 로드됨 -->
            </tbody>
        </table>
    </div>

    <div class="mt-6 flex justify-end">
        <button id="save-all-btn"
            class="w-full md:w-auto bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition shadow-md">
            저장
        </button>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/assignment.js') }}"></script>
{% endblock %}
