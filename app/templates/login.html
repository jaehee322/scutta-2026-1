<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('로그인')}} - SCUTTA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue: {
                            50: '#FDF4FF', 100: '#FAE8FF', 200: '#F5D0FE',
                            400: '#E879F9', 500: '#D946EF', 600: '#C026D3', 700: '#A21CAF',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-gray-50 flex items-center justify-center h-screen">

    <div class="w-full max-w-sm mx-auto px-6">
        <div class="text-center mb-8">
            <a href="{{ url_for('main.index') }}" class="text-3xl font-extrabold text-gray-900">SCUTTA</a>
            <p class="text-gray-400 mt-2 text-sm">{{ _('동아리 기록 페이지에 오신 것을 환영합니다.') }}</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}"
            class="bg-white shadow-sm rounded-2xl px-7 pt-7 pb-7 border border-gray-100">

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="bg-red-50 border border-red-100 text-red-600 p-3 mb-5 rounded-xl text-sm" role="alert">
                <p>{{ message }}</p>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <div class="mb-4">
                <label class="block text-gray-500 text-sm font-semibold mb-1.5" for="username">
                    {{_ ('아이디(이름)') }}
                </label>
                <input id="username" name="username" type="text" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="mb-5">
                <label class="block text-gray-500 text-sm font-semibold mb-1.5" for="password">
                    {{ _('비밀번호') }}
                </label>
                <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <div class="mb-5">
                <label for="remember" class="flex items-center select-none cursor-pointer">
                    <input type="checkbox" id="remember" name="remember"
                        class="h-4 w-4 rounded border-gray-300 text-blue-500 focus:ring-blue-400 accent-blue-500">
                    <span class="ml-2 block text-sm text-gray-600">
                        {{ _('로그인 상태 유지') }}
                    </span>
                </label>
            </div>

            <div>
                <button class="btn-submit" type="submit">
                    {{ _('로그인') }}
                </button>
            </div>

            <div class="mt-5 flex justify-center">
                <div class="flex items-center space-x-2">
                    <a href="{{ url_for('auth.set_language', lang_code='ko') }}"
                        class="block w-8 h-8 rounded-full overflow-hidden border-2 border-transparent hover:border-blue-300 transition"
                        title="한국어">
                        <img src="https://flagcdn.com/kr.svg" alt="한국어" class="w-full h-full object-cover">
                    </a>
                    <a href="{{ url_for('auth.set_language', lang_code='en') }}"
                        class="block w-8 h-8 rounded-full overflow-hidden border-2 border-transparent hover:border-blue-300 transition"
                        title="English">
                        <img src="https://flagcdn.com/us.svg" alt="English" class="w-full h-full object-cover">
                    </a>
                </div>
            </div>

        </form>
    </div>

</body>

</html>
